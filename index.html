<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player">
        <div class="album-art">
            <img src="https://picsum.photos/300/300?random=20" alt="Album Art">
        </div>
        <div class="song-info">
            <h2>Song Title</h2>
            <p>Artist Name</p>
        </div>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <div class="time">
            <span>0:00</span>
            <span>3:45</span>
        </div>
        <div class="controls">
            <button class="prev">⏮</button>
            <button class="play">▶</button>
            <button class="next">⏭</button>
        </div>
    </div>
</body>
</html>
